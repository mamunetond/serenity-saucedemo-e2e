serenity {
  project.name = "SauceDemo E2E - Prueba Técnica"
  take.screenshots = FOR_EACH_ACTION
  restart.browser.for.each = scenario
}

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = [
        "--start-maximized",
        "--remote-allow-origins=*",
        "--disable-notifications",
        "--disable-popup-blocking",
        "--incognito"
      ]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com/"
  }
}